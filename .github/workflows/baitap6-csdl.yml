name: Bai tap 6 - SQL Server and WinForms
on:
  push:
    paths:
      - 'BaiTap6_CSDL/**'
      - '!BaiTap6_CSDL/images/**'
      - 'BaiTap6_CSDL.sln'
      - '.github/workflows/baitap6-csdl.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-verify:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build, SQL integration checks and actual WinForms captures
        shell: powershell
        run: ./BaiTap6_CSDL/Verify.ps1
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BaiTap6-ket-qua-chay-that
          path: BaiTap6_CSDL/images/
      - name: Publish generated screenshots and verification log
        if: success() && github.ref == 'refs/heads/master'
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- BaiTap6_CSDL/images
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'docs: add verified WinForms screenshots and SQL test results'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit evidence.' }
            git pull --rebase origin master
            if ($LASTEXITCODE -ne 0) { throw 'Could not synchronize evidence with repository.' }
            git push origin HEAD:master
            if ($LASTEXITCODE -ne 0) { throw 'Could not push evidence; download workflow artifact instead.' }
          }
